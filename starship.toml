"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

format = """\
$hostname:$username\
(\
    at \
    $directory\
)\
$git_branch\
$git_status\
$git_commit\
$git_state\
$git_metrics\
$cmd_duration\
"""

add_newline = false

[hostname]
style = "bold sky"
format = '[$hostname](fg:$style)'
ssh_only=false

[username]
style_user = "bold sapphire"
format = '[$user](fg:$style) '
disabled = false
show_always = true

[directory]
style = "bold lavender"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
read_only ="  "

[cmd_duration]
style = "bold yellow"
format = "took [ $duration]($style) "

[git_branch]
format = "via [$symbol$branch]($style) "
style = "bold mauve"
symbol = " "

[git_status]
style = "bold flamingo"

[git_commit]
format = '[\(#$hash$tag\)]($style) '
style = "bold teal"
tag_disabled = false
only_detached = true
tag_symbol = ' @'

[git_metrics]
added_style = 'bold teal'
deleted_style = 'bold flamingo'
disabled = false

[palettes.catppuccin_mocha]
rosewater = "224"
flamingo = "224"
pink = "218"
